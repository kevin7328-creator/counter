<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .number {
            font-size: 16rem;
            font-weight: 800;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        button {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 25px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        button:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 50px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        <div class="btn-group" id="controls">
            <button onclick="changeCount(-1)">-</button>
            <button onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        const TOPIC = "mure_pos_live_counter_channel_2026";
        const SERVER_URL = `https://ntfy.sh/${TOPIC}`;
        
        let currentCount = 0;
        const countView = document.getElementById('count-view');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        if (window.location.search.includes('view')) {
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        // 실시간 신호 감지 스트리밍 연결 (0.1초 초고속 연동)
        const eventSource = new EventSource(`${SERVER_URL}/sse`);
        
        eventSource.onmessage = (event) => {
            try {
                const eventData = JSON.parse(event.data);
                if (eventData && eventData.message !== undefined && !isNaN(eventData.message)) {
                    currentCount = Number(eventData.message);
                    countView.innerText = currentCount;
                }
            } catch (e) {
                console.log("신호 대기 중...");
            }
        };

        // 🌟 [추가] 화면이 켜지자마자 서버에 누적된 마지막 값을 강제로 긁어오는 안전장치
        function loadLastSignalFromServer() {
            fetch(`${SERVER_URL}/json?since=all`)
                .then(res => res.text())
                .then(text => {
                    const lines = text.trim().split("\n");
                    for (let i = lines.length - 1; i >= 0; i--) {
                        if (!lines[i]) continue;
                        const data = JSON.parse(lines[i]);
                        if (data && data.message !== undefined && !isNaN(data.message)) {
                            currentCount = Number(data.message);
                            countView.innerText = currentCount;
                            break; // 가장 최근 마지막 숫자 하나만 찾으면 탈출
                        }
                    }
                })
                .catch(err => console.log("초기 로딩 대기..."));
        }

        function changeCount(amount) {
            const nextCount = currentCount + amount;
            sendSignal(nextCount);
        }

        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                sendSignal(0);
            }
        }

        function sendSignal(value) {
            fetch(SERVER_URL, {
                method: 'POST',
                body: String(value)
            });
        }

        // 화면 켜지는 순간 바로 실행
        loadLastSignalFromServer();
    </script>
</body>
</html>
