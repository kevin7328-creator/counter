<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        .number {
            font-size: 14rem;
            font-weight: 800;
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }
        /* 🌟 새로 추가된 판수 선택 버튼 그룹 스타일 */
        .plate-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
            width: 90%;
            max-width: 500px;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300; /* 주방에서 잘 보이도록 따뜻한 오렌지/노란색 계열 강조 */
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate:active {
            background-color: #48484a;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-control:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 40px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        
        <div class="plate-group" id="plate-area">
            <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
            <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
            <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
            <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
        </div>

        <div class="btn-group" id="controls">
            <button class="btn-control" onclick="changeCount(-1)">-</button>
            <button class="btn-control" onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        const TOPIC = "mure_pos_live_counter_channel_2026";
        const SERVER_URL = `https://ntfy.sh/${TOPIC}`;
        
        let currentCount = 0;
        let isFirstLoaded = false;
        
        const countView = document.getElementById('count-view');
        const plateArea = document.getElementById('plate-area');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        // ?view 주소로 들어오면 조작 관련 모든 레이아웃을 완전 차단
        if (window.location.search.includes('view')) {
            plateArea.classList.add('hidden');
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        // 0.1초 실시간 연동 스트리밍
        const eventSource = new EventSource(`${SERVER_URL}/sse`);
        
        eventSource.onmessage = (event) => {
            try {
                const eventData = JSON.parse(event.data);
                if (eventData && eventData.message !== undefined) {
                    const cleanMessage = eventData.message.trim();
                    if (cleanMessage !== "" && !isNaN(cleanMessage)) {
                        currentCount = Number(cleanMessage);
                        countView.innerText = currentCount;
                        isFirstLoaded = true;
                    }
                }
            } catch (e) { }
        };

        // 서버 로그 추적하여 마지막 숫자 가져오기
        function loadLastSignalFromServer() {
            fetch(`${SERVER_URL}/json?since=all&nocache=` + new Date().getTime(), { cache: "no-store" })
                .then(res => res.text())
                .then(text => {
                    if (!text.trim()) return;
                    const lines = text.trim().split("\n");
                    for (let i = lines.length - 1; i >= 0; i--) {
                        if (!lines[i]) continue;
                        try {
                            const data = JSON.parse(lines[i]);
                            if (data && data.message !== undefined) {
                                const cleanMsg = data.message.trim();
                                if (cleanMsg !== "" && !isNaN(cleanMsg)) {
                                    currentCount = Number(cleanMsg);
                                    countView.innerText = currentCount;
                                    isFirstLoaded = true;
                                    return;
                                }
                            }
                        } catch(e) { }
                    }
                })
                .catch(err => console.log("연결 재시도 중..."));
        }

        // 🌟 [추가] 판수 버튼 전용 함수: 더하는 게 아니라 그 숫자로 즉시 고정
        function setPlateCount(targetNumber) {
            currentCount = Number(targetNumber);
            countView.innerText = currentCount;
            sendSignal(currentCount);
        }

        // 미세 조절 (+1, -1)
        function changeCount(amount) {
            const nextCount = Number(currentCount) + Number(amount);
            currentCount = nextCount;
            countView.innerText = currentCount;
            sendSignal(nextCount);
        }

        // 전체 초기화
        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                currentCount = 0;
                countView.innerText = 0;
                sendSignal(0);
            }
        }

        // 서버 신호 전송
        function sendSignal(value) {
            fetch(SERVER_URL, {
                method: 'POST',
                body: String(value)
            });
        }

        // 구동 즉시 실행 및 지연 방지용 0.5초 뒤 재체크
        loadLastSignalFromServer();
        setTimeout(loadLastSignalFromServer, 500);
    </script>
</body>
</html>
