<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 공유 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .number {
            font-size: 16rem;
            font-weight: 800;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        button {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 25px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        button:active {
            background-color: #444444;
        }
        /* 초기화 버튼 전용 스타일: 아래로 대폭 떨어뜨림 */
        .reset-container {
            margin-bottom: 40px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d; /* 경고 의미로 붉은빛 글씨 */
            border: 1px solid #222222;
            padding: 10px 25px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 카운터 본체 -->
    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        <div class="btn-group" id="controls">
            <button onclick="changeCount(-1)">-</button>
            <button onclick="changeCount(1)">+</button>
        </div>
    </div>

    <!-- 안전하게 떨어뜨린 초기화 버튼 공간 -->
    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        // 안전한 실시간 전용 데이터 주소
        const API_URL = "https://api.counterapi.dev/v1/mure_live_counter_final/counter";
        
        let currentCount = 0;
        const countView = document.getElementById('count-view');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        // 주소창 맨 뒤에 ?view 가 붙어있으면 조작 버튼과 초기화 버튼을 모두 숨깁니다.
        if (window.location.search.includes('view')) {
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        // 서버에서 최신 숫자를 실시간으로 가져오는 함수
        function updateCountFromServer() {
            fetch(API_URL + "?nocache=" + new Date().getTime(), {
                method: "GET",
                headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.count !== undefined) {
                    currentCount = data.count;
                    countView.innerText = currentCount;
                }
            })
            .catch(err => console.log("연결 대기 중..."));
        }

        // 플러스, 마이너스 버튼 작동
        function changeCount(amount) {
            currentCount += amount;
            countView.innerText = currentCount;

            const action = amount === 1 ? '/up' : '/down';
            fetch(API_URL + action)
                .then(res => res.json())
                .then(data => {
                    if(data && data.count !== undefined) {
                        currentCount = data.count;
                        countView.innerText = currentCount;
                    }
                });
        }

        // 🌟 숫자 초기화(0) 기능 함수
        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                currentCount = 0;
                countView.innerText = 0;

                // 서버의 숫자를 0으로 강제 세팅하는 주소 요청
                fetch(API_URL + "/set?count=0")
                    .then(res => res.json())
                    .then(data => {
                        if(data && data.count !== undefined) {
                            currentCount = data.count;
                            countView.innerText = currentCount;
                        }
                    });
            }
        }

        // 최초 실행 및 0.5초마다 강제 동기화
        updateCountFromServer();
        setInterval(updateCountFromServer, 500);
    </script>
</body>
</html>
