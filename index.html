<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        .counter-container { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%; }
        .number { font-size: 14rem; font-weight: 800; margin: 5px 0; font-variant-numeric: tabular-nums; }
        .plate-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 25px; width: 90%; max-width: 500px; }
        .btn-plate { flex: 1; background-color: #2c2c2e; color: #ffb300; border: 2px solid #48484a; padding: 15px 0; font-size: 1.4rem; font-weight: bold; border-radius: 15px; cursor: pointer; transition: background 0.1s; }
        .btn-plate:active { background-color: #48484a; }
        .btn-group { display: flex; gap: 25px; justify-content: center; }
        .btn-control { background-color: #1a1a1a; color: white; border: 2px solid #333333; padding: 20px 50px; font-size: 3rem; font-weight: bold; border-radius: 20px; cursor: pointer; transition: background 0.1s; }
        .btn-control:active { background-color: #444444; }
        .reset-container { margin-bottom: 40px; }
        .btn-reset { background-color: #111111; color: #ff4d4d; border: 1px solid #222222; padding: 12px 30px; font-size: 1.2rem; border-radius: 10px; cursor: pointer; }
        .btn-reset:active { background-color: #331111; }
        .hidden { display: none !important; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #ff4d4d; position: fixed; top: 15px; right: 15px; }
        .status-dot.online { background-color: #34c759; }
    </style>
</head>
<body>

    <div class="status-dot" id="status-dot" title="연결 상태"></div>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        
        <div class="plate-group" id="plate-area">
            <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
            <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
            <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
            <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
        </div>

        <div class="btn-group" id="controls">
            <button class="btn-control" onclick="changeCount(-1)">-</button>
            <button class="btn-control" onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <!-- 안정적인 cdnjs 라이브러리 사용 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

    <script>
        const TOPIC = "mure/pos/live/counter/secure/2026"; 
        
        // EMQX 공용 고속 웹소켓 브로커 (HiveMQ 대안)
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            keepalive: 30,
            reconnectPeriod: 2000
        });
        
        let currentCount = Number(localStorage.getItem('mure_last_count')) || 0;
        
        const countView = document.getElementById('count-view');
        const plateArea = document.getElementById('plate-area');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');
        const statusDot = document.getElementById('status-dot');

        const isViewMode = window.location.search.includes('view');

        if (isViewMode) {
            plateArea.classList.add('hidden');
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        countView.innerText = currentCount;

        client.on('connect', () => {
            statusDot.classList.add('online');
            client.subscribe(TOPIC);
            sendSignal("REQ_SYNC");
        });

        client.on('offline', () => {
            statusDot.classList.remove('online');
        });

        client.on('error', (err) => {
            console.error("MQTT 에러:", err);
            statusDot.classList.remove('online');
        });

        client.on('message', (topic, message) => {
            const msg = message.toString().trim();
            
            if (msg === "REQ_SYNC") {
                if (!isViewMode) {
                    sendSignal("ANS:" + currentCount);
                }
            } 
            else if (msg.startsWith("ANS:")) {
                const targetNum = msg.split(":")[1];
                if (!isNaN(targetNum)) {
                    updateLocalAndScreen(Number(targetNum));
                }
            } 
            else if (!isNaN(msg) && msg !== "") {
                updateLocalAndScreen(Number(msg));
            }
        });

        function updateLocalAndScreen(num) {
            currentCount = num;
            countView.innerText = currentCount;
            localStorage.setItem('mure_last_count', currentCount);
        }

        function setPlateCount(targetNumber) {
            updateLocalAndScreen(targetNumber);
            sendSignal(targetNumber);
        }

        function changeCount(amount) {
            const nextCount = Number(currentCount) + Number(amount);
            updateLocalAndScreen(nextCount);
            sendSignal(nextCount);
        }

        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                updateLocalAndScreen(0);
                sendSignal(0);
            }
        }

        function sendSignal(value) {
            if (client && client.connected) {
                client.publish(TOPIC, String(value));
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible" && client && client.connected) {
                sendSignal("REQ_SYNC");
            }
        });
    </script>
</body>
</html>
