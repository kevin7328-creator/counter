<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        .number {
            font-size: 14rem;
            font-weight: 800;
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }
        .plate-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
            width: 90%;
            max-width: 500px;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300;
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate:active {
            background-color: #48484a;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-control:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 40px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        
        <div class="plate-group" id="plate-area">
            <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
            <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
            <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
            <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
        </div>

        <div class="btn-group" id="controls">
            <button class="btn-control" onclick="changeCount(-1)">-</button>
            <button class="btn-control" onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        // 새로운 고유 토픽 이름으로 변경되었습니다. (충돌 방지 강화)
        const TOPIC = "mure_live_counter_x9k2_7f8d"; 
        const SERVER_URL = `https://ntfy.sh/${TOPIC}`;
        
        // 고유 브라우저 ID 생성 (내가 보낸 신호를 내가 필터링하기 위함)
        const MY_ID = "DEVICE_" + Math.random().toString(36).substring(2, 9);
        
        let currentCount = Number(localStorage.getItem('mure_last_count')) || 0;
        let sendTimeout = null;
        
        const countView = document.getElementById('count-view');
        const plateArea = document.getElementById('plate-area');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        const isViewMode = window.location.search.includes('view');

        if (isViewMode) {
            plateArea.classList.add('hidden');
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        countView.innerText = currentCount;

        // SSE 연결 함수 (네트워크 단절 시 재연결 로직 포함)
        let eventSource;
        function connectSSE() {
            if (eventSource) eventSource.close();

            eventSource = new EventSource(`${SERVER_URL}/sse`);
            
            eventSource.onmessage = (event) => {
                try {
                    const eventData = JSON.parse(event.data);
                    if (eventData && eventData.message !== undefined) {
                        const rawMsg = eventData.message.trim();
                        
                        // JSON 데이터 분해 시도
                        let parsed;
                        try {
                            parsed = JSON.parse(rawMsg);
                        } catch(e) {
                            // 구버전 호환용 (단순 문자열인 경우)
                            parsed = { sender: "unknown", type: "SET", val: rawMsg };
                        }

                        // 내가 보낸 신호라면 무시 (네트워크 대역폭 및 배터리 절약)
                        if (parsed.sender === MY_ID) return;

                        // 1. 동기화 요청을 받았을 때
                        if (parsed.type === "REQ_SYNC") {
                            if (!isViewMode) {
                                sendSignal("ANS", currentCount);
                            }
                        } 
                        // 2. 다른 기기의 카운트 변경 신호나 답변을 받았을 때
                        else if (parsed.type === "SET" || parsed.type === "ANS") {
                            const targetNum = Number(parsed.val);
                            if (!isNaN(targetNum)) {
                                updateLocalAndScreen(targetNum);
                            }
                        }
                    }
                } catch (e) { }
            };

            eventSource.onerror = () => {
                // 연결이 끊어지면 3초 뒤 재연결 시도
                setTimeout(connectSSE, 3000);
            };
        }

        connectSSE();

        function updateLocalAndScreen(num) {
            currentCount = num;
            countView.innerText = currentCount;
            localStorage.setItem('mure_last_count', currentCount);
        }

        // 판수 세팅
        function setPlateCount(targetNumber) {
            updateLocalAndScreen(targetNumber);
            sendSignalDelayed("SET", targetNumber);
        }

        // 미세 조절
        function changeCount(amount) {
            const nextCount = Number(currentCount) + Number(amount);
            updateLocalAndScreen(nextCount);
            sendSignalDelayed("SET", nextCount); // 연타 시 서버 부담을 줄이기 위해 딜레이 전송
        }

        // 초기화
        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                updateLocalAndScreen(0);
                sendSignal("SET", 0);
            }
        }

        // 실시간 연타 시 ntfy 차단을 막기 위한 디바운스(Debounce) 전송
        function sendSignalDelayed(type, value) {
            if (sendTimeout) clearTimeout(sendTimeout);
            sendTimeout = setTimeout(() => {
                sendSignal(type, value);
            }, 200); // 0.2초 이내의 추가 클릭은 무시하고 최종 값만 전송
        }

        // 서버 신호 전송 함수
        function sendSignal(type, value) {
            const payload = {
                sender: MY_ID,
                type: type,
                val: String(value)
            };

            fetch(SERVER_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).catch(err => console.log("전송 실패:", err));
        }

        // 접속 시 동기화 요청
        setTimeout(() => {
            sendSignal("REQ_SYNC", "");
        }, 500);
    </script>
</body>
</html>
