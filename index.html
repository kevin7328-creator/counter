<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        .number {
            font-size: 14rem;
            font-weight: 800;
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }
        .plate-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
            width: 90%;
            max-width: 500px;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300;
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate:active {
            background-color: #48484a;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-control:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 40px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        
        <div class="plate-group" id="plate-area">
            <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
            <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
            <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
            <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
        </div>

        <div class="btn-group" id="controls">
            <button class="btn-control" onclick="changeCount(-1)">-</button>
            <button class="btn-control" onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        // 🌟 [보안 100% 개방] 언제 어디서나 읽고 쓸 수 있는 완전 공용 영구 저장소 주소
        const DB_URL = "https://mure-counter-default-rtdb.asia-southeast1.firebasedatabase.app/mure_bakery_count.json";
        
        let currentCount = 0;
        let isSaving = false; // 내가 버튼 누르는 순간 다른 기기의 자동 조회가 내 숫자를 덮어쓰지 않게 막는 안전핀
        
        const countView = document.getElementById('count-view');
        const plateArea = document.getElementById('plate-area');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        if (window.location.search.includes('view')) {
            plateArea.classList.add('hidden');
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        // 🌟 [핵심] 서버 저장소에 들어있는 '진짜 최종 숫자'를 무조건 긁어오는 함수
        function getCountFromServer() {
            if (isSaving) return; // 전송 중일 땐 튕김 방지를 위해 패스

            // 아이폰 사파리가 과거 데이터를 재탕(캐시)하지 못하게 난수 주소 강제 적용
            fetch(DB_URL + "?nocache=" + new Date().getTime(), { cache: "no-store" })
                .then(res => res.json())
                .then(data => {
                    if (isSaving) return;
                    
                    // 서버에 값이 제대로 존재할 때만 화면 갱신
                    if (data !== null && data !== undefined && !isNaN(data)) {
                        currentCount = Number(data);
                        countView.innerText = currentCount;
                    }
                })
                .catch(err => console.log("서버 연결 대기 중..."));
        }

        // 🌟 [핵심] 누른 숫자를 서버 주머니에 영구히 저장하는 함수
        function saveCountToServer(targetValue) {
            isSaving = true;
            
            fetch(DB_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(targetValue)
            })
            .then(() => {
                // 서버 전송이 완전히 끝나고 0.2초 뒤에 락을 해제하여 안정성 극대화
                setTimeout(() => { isSaving = false; }, 200);
            })
            .catch(() => {
                isSaving = false;
            });
        }

        // 판수 선택 (그 숫자로 즉시 고정 및 저장)
        function setPlateCount(targetNumber) {
            currentCount = Number(targetNumber);
            countView.innerText = currentCount;
            saveCountToServer(currentCount);
        }

        // 미세 조절 (+1, -1)
        function changeCount(amount) {
            currentCount = Number(currentCount) + Number(amount);
            countView.innerText = currentCount;
            saveCountToServer(currentCount);
        }

        // 초기화
        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                currentCount = 0;
                countView.innerText = 0;
                saveCountToServer(0);
            }
        }

        // 켜자마자 서버 저장소에서 마지막에 쓰던 숫자 긁어오기 (새로고침 버그 박멸)
        getCountFromServer();

        // 🌟 0.4초(400ms)마다 서버 저장소를 계속 감시하여 다른 기기들과 오차 없이 실시간 동기화
        setInterval(getCountFromServer, 400);
    </script>
</body>
</html>
