<!DOCTYPE html><html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터 & 호출벨</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            box-sizing: border-box;
        }
        /* 상단 대기 숫자 영역 */
        .number-zone {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .number {
            font-size: 16rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        /* 하단 제어 영역 */
        .control-zone {
            height: 35vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .plate-group, .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 90%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        button {
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300;
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.3rem;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            flex: 1;
        }
        /* 디저트 메뉴 버튼 스타일 */
        .hall-group {
            display: flex;
            gap: 20px;
            width: 90%;
            max-width: 500px;
            justify-content: center;
        }
        .btn-dessert {
            flex: 1;
            padding: 30px 0;
            font-size: 1.8rem;
            border: 3px solid #007aff;
            background-color: #1c1c1e;
            color: #30b0ff;
        }
        /* 하단 고정형 테이블 번호판 */
        .table-inline-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 92%;
            max-width: 550px;
        }
        .btn-table {
            background-color: #1c1c1e;
            color: #fff;
            border: 2px solid #007aff;
            padding: 18px 0;
            font-size: 1.2rem;
        }
        /* 디저트를 잘못 골랐을 때 되돌아가는 전용 취소 버튼 */
        .btn-cancel {
            background-color: #ff453a;
            color: #fff;
            border: none;
            grid-column: span 5;
            padding: 15px 0;
            font-size: 1.2rem;
            margin-top: 5px;
        }
        /* 하단 안내문구 상자 */
        .status-msg {
            font-size: 1.5rem;
            font-weight: bold;
            color: #34c759;
            background-color: #1c1c1e;
            border: 2px solid #34c759;
            padding: 22px 0;
            border-radius: 15px;
            text-align: center;
            width: 85%;
            max-width: 450px;
            box-sizing: border-box;
        }
        /* 주방용 호출 알림 팝업 (폰 전용) */
        .kitchen-alert {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .kitchen-content { text-align: center; width: 90%; }
