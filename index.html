<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        .number {
            font-size: 14rem;
            font-weight: 800;
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }
        .plate-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
            width: 90%;
            max-width: 500px;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300;
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate:active {
            background-color: #48484a;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-control:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 40px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        
        <div class="plate-group" id="plate-area">
            <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
            <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
            <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
            <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
        </div>

        <div class="btn-group" id="controls">
            <button class="btn-control" onclick="changeCount(-1)">-</button>
            <button class="btn-control" onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        const TOPIC = "mure_pos_live_counter_channel_2026";
        const SERVER_URL = `https://ntfy.sh/${TOPIC}`;
        
        let currentCount = 0;
        const countView = document.getElementById('count-view');
        const plateArea = document.getElementById('plate-area');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        const isViewMode = window.location.search.includes('view');

        if (isViewMode) {
            plateArea.classList.add('hidden');
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        // 실시간 신호 연동
        const eventSource = new EventSource(`${SERVER_URL}/sse`);
        
        eventSource.onmessage = (event) => {
            try {
                const eventData = JSON.parse(event.data);
                if (eventData && eventData.message !== undefined) {
                    const msg = eventData.message.trim();
                    
                    // 🌟 1. 누군가 새로고침해서 "숫자 좀 보내달라"고 요청한 경우 (REQ 신호)
                    if (msg === "REQ_CURRENT_COUNT") {
                        // 내가 조작 모드이고, 화면에 숫자가 있다면 그 숫자를 서버에 즉시 다시 쏴줌
                        if (!isViewMode && currentCount > 0) {
                            sendSignal("ANS:" + currentCount);
                        }
                    } 
                    // 🌟 2. 새로고침한 기기를 위해 기존 폰이 숫자를 토스해준 경우 (ANS 신호)
                    else if (msg.startsWith("ANS:")) {
                        const targetNum = msg.split(":")[1];
                        if (!isNaN(targetNum)) {
                            currentCount = Number(targetNum);
                            countView.innerText = currentCount;
                        }
                    } 
                    // 3. 일반적인 숫자 변동 신호인 경우
                    else if (!isNaN(msg) && msg !== "") {
                        currentCount = Number(msg);
                        countView.innerText = currentCount;
                    }
                }
            } catch (e) { }
        };

        // 🌟 [핵심] 접속하자마자 다른 기기들에게 "현재 숫자 동기화 신호"를 구걸하는 함수
        function requestSync() {
            sendSignal("REQ_CURRENT_COUNT");
        }

        function setPlateCount(targetNumber) {
            currentCount = Number(targetNumber);
            countView.innerText = currentCount;
            sendSignal(currentCount);
        }

        function changeCount(amount) {
            const nextCount = Number(currentCount) + Number(amount);
            currentCount = nextCount;
            countView.innerText = currentCount;
            sendSignal(nextCount);
        }

        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                currentCount = 0;
                countView.innerText = 0;
                sendSignal(0);
            }
        }

        function sendSignal(value) {
            fetch(SERVER_URL, {
                method: 'POST',
                body: String(value)
            });
        }

        // 켜지자마자 다른 폰에 동기화 신호 요청 (0.2초 딜레이를 주어 안정성 확보)
        setTimeout(requestSync, 200);
    </script>
</body>
</html>
