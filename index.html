<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        .number {
            font-size: 14rem;
            font-weight: 800;
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }
        .plate-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
            width: 90%;
            max-width: 500px;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300;
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate:active {
            background-color: #48484a;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-control:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 40px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        
        <div class="plate-group" id="plate-area">
            <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
            <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
            <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
            <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
        </div>

        <div class="btn-group" id="controls">
            <button class="btn-control" onclick="changeCount(-1)">-</button>
            <button class="btn-control" onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        // 1. 일시적 서버 과부하를 피하기 위해 토픽명 끝에 임의로 _v2를 붙였습니다. 필요시 변경 가능합니다.
        const TOPIC = "mure_pos_live_counter_channel_2026_v2"; 
        const SERVER_URL = `https://ntfy.sh/${TOPIC}`;
        
        let currentCount = Number(localStorage.getItem('mure_last_count')) || 0;
        
        const countView = document.getElementById('count-view');
        const plateArea = document.getElementById('plate-area');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        const isViewMode = window.location.search.includes('view');

        if (isViewMode) {
            plateArea.classList.add('hidden');
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        countView.innerText = currentCount;

        // --- SSE 연결 함수 구조화 (연결 끊김 대응) ---
        let eventSource;

        function connectSSE() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`${SERVER_URL}/sse`);
            
            eventSource.onmessage = (event) => {
                try {
                    const eventData = JSON.parse(event.data);
                    if (eventData && eventData.message !== undefined) {
                        const msg = eventData.message.trim();
                        
                        if (msg === "REQ_SYNC") {
                            if (!isViewMode) {
                                sendSignal("ANS:" + currentCount);
                            }
                        } 
                        else if (msg.startsWith("ANS:")) {
                            const targetNum = msg.split(":")[1];
                            if (!isNaN(targetNum)) {
                                updateLocalAndScreen(Number(targetNum));
                            }
                        } 
                        else if (!isNaN(msg) && msg !== "") {
                            updateLocalAndScreen(Number(msg));
                        }
                    }
                } catch (e) { console.error("데이터 파싱 에러:", e); }
            };

            // 연결이 끊어지면 3초 후 자동으로 재연결 시도
            eventSource.onerror = (err) => {
                console.error("SSE 연결 끊김, 재연결 시도 중...", err);
                eventSource.close();
                setTimeout(connectSSE, 3000); 
            };
        }

        // 최초 연결 실행
        connectSSE();

        // 모바일 화면이 꺼졌다가 켜질 때(다시 브라우저로 돌아올 때) 끊긴 연결을 강제 재연결 및 싱크 요청
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                connectSSE();
                setTimeout(() => { sendSignal("REQ_SYNC"); }, 500);
            }
        });

        function updateLocalAndScreen(num) {
            currentCount = num;
            countView.innerText = currentCount;
            localStorage.setItem('mure_last_count', currentCount);
        }

        function setPlateCount(targetNumber) {
            updateLocalAndScreen(targetNumber);
            sendSignal(targetNumber);
        }

        function changeCount(amount) {
            const nextCount = Number(currentCount) + Number(amount);
            updateLocalAndScreen(nextCount);
            sendSignal(nextCount);
        }

        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                updateLocalAndScreen(0);
                sendSignal(0);
            }
        }

        function sendSignal(value) {
            fetch(SERVER_URL, {
                method: 'POST',
                body: String(value)
            }).catch(err => {
                console.error("신호 전송 실패 (네트워크 혹은 서버 제한):", err);
            });
        }

        // 접속 0.5초 후 동기화 신호 송신
        setTimeout(() => {
            sendSignal("REQ_SYNC");
        }, 500);
    </script>
</body>
</html>
