<!DOCTYPE html><html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터 & 호출벨 (v1.3.4)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            box-sizing: border-box;
        }
        .number-zone {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .number {
            font-size: 16rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .control-zone {
            height: 35vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .plate-group, .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 90%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        button {
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300;
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.3rem;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            flex: 1;
        }
        .hall-group {
            display: flex;
            gap: 20px;
            width: 90%;
            max-width: 500px;
            justify-content: center;
        }
        .btn-dessert {
            flex: 1;
            padding: 30px 0;
            font-size: 1.8rem;
            border: 3px solid #007aff;
            background-color: #1c1c1e;
            color: #30b0ff;
        }
        .table-inline-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 92%;
            max-width: 550px;
        }
        .btn-table {
            background-color: #1c1c1e;
            color: #fff;
            border: 2px solid #007aff;
            padding: 18px 0;
            font-size: 1.2rem;
        }
        .btn-cancel {
            background-color: #ff453a;
            color: #fff;
            border: none;
            grid-column: span 5;
            padding: 15px 0;
            font-size: 1.2rem;
            margin-top: 5px;
        }
        .status-msg {
            font-size: 1.5rem;
            font-weight: bold;
            color: #34c759;
            background-color: #1c1c1e;
            border: 2px solid #34c759;
            padding: 22px 0;
            border-radius: 15px;
            text-align: center;
            width: 85%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .kitchen-alert {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .kitchen-content { text-align: center; width: 90%; }
        .kitchen-msg { font-size: 4rem; font-weight: 900; color: #ff9f0a; margin-bottom: 40px; line-height: 1.4; }
        .btn-confirm { background-color: #34c759; color: white; font-size: 3rem; padding: 20px 80px; border: none; }
        
        @keyframes flash {
            0% { background-color: #000; }
            50% { background-color: #ff453a; }
            100% { background-color: #000; }
        }
        .flashing { animation: flash 0.6s infinite; }
        
        .reset-container { position: fixed; bottom: 10px; left: 10px; margin: 0; z-index: 5; }
        .btn-reset { background-color: #111111; color: #ff4d4d; border: 1px solid #222222; padding: 8px 18px; font-size: 1rem; border-radius: 8px; }
        
        .code-version-tag {
            position: fixed;
            bottom: 12px;
            right: 15px;
            font-size: 0.8rem;
            color: #555555;
            font-family: monospace;
            z-index: 5;
            background-color: rgba(20, 20, 20, 0.8);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #222222;
            pointer-events: none;
        }
        
        .hidden { display: none !important; }
    </style></head><body id="main-body">

    <div class="counter-container">
        <div class="number-zone">
            <div class="number" id="count-view">0</div>
        </div>
        
        <div class="control-zone">
            <div id="kitchen-area" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <div class="plate-group">
                    <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
                    <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
                    <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
                    <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
                </div>
                <div class="btn-group">
                    <button class="btn-control" onclick="changeCount(-1)">-</button>
                    <button class="btn-control" onclick="changeCount(1)">+</button>
                </div>
            </div>

            <div id="hall-area" class="hall-group hidden">
                <button class="btn-dessert" onclick="showInlineTables(1)">🍨 젤라또</button>
                <button class="btn-dessert" onclick="showInlineTables(2)">🍰 티라미수</button>
            </div>

            <div id="table-inline-area" class="table-inline-grid hidden">
                <button class="btn-table" onclick="selectTable(1)">1번</button>
                <button class="btn-table" onclick="selectTable(2)">2번</button>
                <button class="btn-table" onclick="selectTable(3)">3번</button>
                <button class="btn-table" onclick="selectTable(4)">4번</button>
                <button class="btn-table" onclick="selectTable(5)">5번</button>
                <button class="btn-table" onclick="selectTable(6)">6번</button>
                <button class="btn-table" onclick="selectTable(7)">7번</button>
                <button class="btn-table" onclick="selectTable(8)">8번</button>
                <button class="btn-table" onclick="selectTable(9)">바(Bar)</button>
                <button class="btn-cancel" onclick="cancelTableSelect()">❌ 디저트 다시 고르기</button>
            </div>

            <div id="status-message-box" class="status-msg hidden"></div>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">초기화</button>
    </div>

    <div class="code-version-tag">v1.3.4</div>

    <div class="kitchen-alert" id="kitchen-popup">
        <div class="kitchen-content">
            <div class="kitchen-msg" id="kitchen-msg-text">호출 들어옴</div>
            <button class="btn-confirm" onclick="dismissKitchenAlert()">주방 확인 완료</button>
        </div>
    </div>

    <script>
        const TOPIC = "mure_pos_live_counter_channel_2026";
        const SERVER_URL = `https://ntfy.sh/${TOPIC}`;
        
        let currentCount = Number(localStorage.getItem('mure_last_count')) || 0;
        if (currentCount > 30) currentCount = 30;
        
        let selectedDessertCode = 0; 
        
        const countView = document.getElementById('count-view');
        const kitchenArea = document.getElementById('kitchen-area');
        const hallArea = document.getElementById('hall-area');
        const tableInlineArea = document.getElementById('table-inline-area');
        const resetArea = document.getElementById('reset-area');
        const statusMessageBox = document.getElementById('status-message-box');
        const kitchenPopup = document.getElementById('kitchen-popup');
        const mainBody = document.getElementById('main-body');

        // URL에 ?view가 포함되어 있으면 홀(뷰어) 모드, 없으면 주방 모드
        const isViewMode = window.location.search.includes('view');

        if (isViewMode) {
            kitchenArea.classList.add('hidden');
            resetArea.classList.add('hidden');
            hallArea.classList.remove('hidden'); 
        }
        countView.innerText = currentCount;

        // SSE 연결 시작
        const eventSource = new EventSource(`${SERVER_URL}/sse`);
        
        eventSource.onmessage = (event) => {
            try {
                const eventData = JSON.parse(event.data);
                if (!eventData || eventData.event !== "message" || eventData.message === undefined) return;
                
                // 전송된 그대로의 순수 문자열 추출
                const rawMsg = eventData.message.toString().trim();
                
                // 1. 동기화 요청 신호 처리
                if (rawMsg === "REQ_SYNC") {
                    if (!isViewMode) sendSignal(String(currentCount));
                    return;
                }

                // 2. 주방 확인 신호 (99999) -> 오직 [홀 모드]만 문구 노출
                if (rawMsg === "99999") {
                    if (isViewMode) {
                        showHallStatus("✓ 주방에서 확인했습니다.");
                    }
                    return;
                }

                // 3. 디저트 호출 신호 검사 (문자열 상태에서 원천 차단 및 격리)
                // 4글자이면서 끝자리가 "30"인 형태 (예: "1130")
                if (rawMsg.length === 4 && rawMsg.endsWith("30")) {
                    // 오직 [주방 모드]일 때만 팝업 띄우고 번쩍임 효과 실행
                    if (!isViewMode) { 
                        const tableCode = rawMsg.charAt(0);
                        const dessertCode = rawMsg.charAt(1);

                        const tableName = (tableCode === "9") ? "바(Bar)" : `${tableCode}번`;
                        const dessertName = (dessertCode === "1") ? "🍨 젤라또" : "🍰 티라미수";
                        
                        mainBody.classList.add('flashing');
                        document.getElementById('kitchen-msg-text').innerHTML = `🔔 [${tableName} 테이블]<br><br><span style="color:#30b0ff;">${dessertName}</span> 준비해주세요!`;
                        kitchenPopup.style.display = 'flex';
                    }
                    return; // 디저트 처리가 끝났으므로 즉시 탈출 (아래 카운트 로직 안 탐)
                }

                // 4. 대기 카운터 신호 검사 (위의 특수 신호들을 다 거르고 남은 1~2자리 순수 숫자만 처리)
                const numData = Number(rawMsg);
                if (!isNaN(numData) && numData >= 0 && numData <= 30) {
                    currentCount = numData;
                    countView.innerText = currentCount;
                    localStorage.setItem('mure_last_count', currentCount);
                    // 숫자가 동기화될 때는 팝업창(kitchenPopup)이나 화면 번쩍임을 절대 제어하지 않음!
                    return;
                }

            } catch (e) { console.error("수신 에러 발생:", e); }
        };

        // 초기 동기화 요청
        setTimeout(() => { sendSignal("REQ_SYNC"); }, 500);

        function showInlineTables(dessertCode) {
            selectedDessertCode = dessertCode;
            hallArea.classList.add('hidden');
            tableInlineArea.classList.remove('hidden');
        }

        function cancelTableSelect() {
            tableInlineArea.classList.add('hidden');
            selectedDessertCode = 0;
            hallArea.classList.remove('hidden');
        }

        function selectTable(tableCode) {
            tableInlineArea.classList.add('hidden');
            const signalValue = `${tableCode}${selectedDessertCode}30`;
            sendSignal(signalValue);

            const tableName = (tableCode === 9) ? "바(Bar)" : `${tableCode}번`;
            const dessertName = (selectedDessertCode === 1) ? "젤라또" : "티라미수";
            showHallStatus(`✈ [${tableName} ${dessertName}] 전송 완료`);
        }

        function showHallStatus(text) {
            hallArea.classList.add('hidden');
            tableInlineArea.classList.add('hidden');
            statusMessageBox.innerText = text;
            statusMessageBox.classList.remove('hidden');

            setTimeout(() => {
                statusMessageBox.classList.add('hidden');
                hallArea.classList.remove('hidden');
            }, 1500);
        }

        function dismissKitchenAlert() {
            kitchenPopup.style.display = 'none';
            mainBody.classList.remove('flashing');
            sendSignal("99999"); 
        }

        function setPlateCount(targetNumber) {
            if (targetNumber > 30) targetNumber = 30;
            sendSignal(String(targetNumber));
        }

        function changeCount(amount) {
            const nextCount = Number(currentCount) + Number(amount);
            if (nextCount >= 0 && nextCount <= 30) {
                sendSignal(String(nextCount));
            }
        }

        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                sendSignal("0");
            }
        }

        function sendSignal(value) {
            fetch(SERVER_URL, { 
                method: 'POST', 
                mode: 'no-cors',
                body: String(value)
            }).catch(e => {});
        }
    </script></body></html>
