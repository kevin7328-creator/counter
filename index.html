<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터 (v2.0.0)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            box-sizing: border-box;
        }
        .number-zone {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .number {
            font-size: 16rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .control-zone {
            height: 35vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .plate-group, .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 90%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        button {
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300;
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.3rem;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            flex: 1;
        }
        .reset-container { position: fixed; bottom: 10px; left: 10px; margin: 0; z-index: 5; }
        .btn-reset { background-color: #111111; color: #ff4d4d; border: 1px solid #222222; padding: 8px 18px; font-size: 1rem; border-radius: 8px; }
        
        .code-version-tag {
            position: fixed;
            bottom: 12px;
            right: 15px;
            font-size: 0.8rem;
            color: #555555;
            font-family: monospace;
            z-index: 5;
            background-color: rgba(20, 20, 20, 0.8);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #222222;
            pointer-events: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body id="main-body">

    <div class="counter-container">
        <div class="number-zone">
            <div class="number" id="count-view">0</div>
        </div>
        
        <div class="control-zone">
            <div id="kitchen-area" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <div class="plate-group">
                    <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
                    <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
                    <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
                    <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
                </div>
                <div class="btn-group">
                    <button class="btn-control" onclick="changeCount(-1)">-</button>
                    <button class="btn-control" onclick="changeCount(1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">초기화</button>
    </div>

    <div class="code-version-tag">v2.0.0</div>

    <script>
        // 주방/홀 모드 분기를 제거하고 카운터 값만 가볍게 관리합니다.
        const FIREBASE_URL = "https://mure-counter-default-rtdb.firebaseio.com/mure_v16/count.json";
        
        let currentCount = Number(localStorage.getItem('mure_last_count')) || 0;
        let sseSource = null;
        
        const countView = document.getElementById('count-view');
        countView.innerText = currentCount;

        // 서버로 숫자 전송 (단일 숫자 값만 깔끔하게 전송)
        function updateFirebaseCount(nextValue) {
            fetch(FIREBASE_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nextValue)
            }).catch(e => console.error("데이터 전송 실패:", e));
        }

        // 실시간 스트리밍 연동 (와이파이 / LTE 공용 표준 규격)
        function connectStream() {
            if (sseSource) {
                sseSource.close();
                sseSource = null;
            }
            
            sseSource = new EventSource(FIREBASE_URL);
            
            sseSource.addEventListener('put', (event) => {
                try {
                    const eventData = JSON.parse(event.data);
                    if (!eventData || eventData.data === undefined) return;
                    
                    const serverValue = Number(eventData.data);

                    if (!isNaN(serverValue) && serverValue >= 0 && serverValue <= 30) {
                        currentCount = serverValue;
                        countView.innerText = currentCount;
                        localStorage.setItem('mure_last_count', currentCount);
                    }
                } catch (e) { console.error("데이터 동기화 오류:", e); }
            });

            // 연결이 완전히 끊겼을 때만 자동 재연결 처리
            sseSource.onerror = () => {
                if (sseSource) {
                    sseSource.close();
                    sseSource = null;
                }
                setTimeout(connectStream, 2000);
            };
        }

        // 첫 실행 및 화면 복귀 시 동기화
        connectStream();
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                connectStream();
            }
        });

        // 조작 함수들
        function setPlateCount(targetNumber) {
            if (targetNumber >= 0 && targetNumber <= 30) {
                updateFirebaseCount(targetNumber);
            }
        }

        function changeCount(amount) {
            const nextCount = currentCount + amount;
            if (nextCount >= 0 && nextCount <= 30) {
                updateFirebaseCount(nextCount);
            }
        }

        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                updateFirebaseCount(0);
            }
        }
    </script>
</body>
</html>
