<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .number {
            font-size: 16rem;
            font-weight: 800;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        button {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 25px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        button:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 50px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        <div class="btn-group" id="controls">
            <button onclick="changeCount(-1)">-</button>
            <button onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        // 🌟 주소 구조를 완벽하게 일치시킴 (데이터가 한 바구니에 담기도록 수정)
        const DB_URL = "https://mure-counter-default-rtdb.asia-southeast1.firebasedatabase.app/live_data.json";
        
        let currentCount = 0;
        let isUpdating = false; 
        
        const countView = document.getElementById('count-view');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        if (window.location.search.includes('view')) {
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        // 서버에서 최신 숫자를 실시간으로 뺏어오는 함수
        function updateCountFromServer() {
            if (isUpdating) return; 

            fetch(DB_URL + "?nocache=" + new Date().getTime(), { cache: "no-store" })
                .then(res => res.json())
                .then(data => {
                    if (isUpdating) return; 
                    
                    // 서버에 저장된 객체에서 count 값을 안전하게 추출
                    if (data !== null && data !== undefined && data.count !== undefined) {
                        currentCount = Number(data.count);
                        countView.innerText = currentCount;
                    }
                })
                .catch(err => console.log("연결 대기 중..."));
        }

        // 버튼 누를 때 실행
        function changeCount(amount) {
            isUpdating = true; 
            currentCount += amount;
            countView.innerText = currentCount;
            
            sendCountToServer(currentCount);
        }

        // 초기화 버튼
        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                isUpdating = true;
                currentCount = 0;
                countView.innerText = 0;
                
                sendCountToServer(0);
            }
        }

        // 서버에 값을 덮어씌우는 함수
        function sendCountToServer(targetValue) {
            fetch(DB_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ count: targetValue }) // count 키값에 맞춰 정확히 전송
            })
            .then(() => {
                setTimeout(() => { isUpdating = false; }, 300);
            })
            .catch(() => {
                isUpdating = false;
            });
        }

        // 켜자마자 실행
        updateCountFromServer();

        // 0.5초마다 무조건 강제 동기화 수행
        setInterval(updateCountFromServer, 500);
    </script>
</body>
</html>
