<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .number {
            font-size: 16rem;
            font-weight: 800;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        button {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 25px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        button:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 50px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        <div class="btn-group" id="controls">
            <button onclick="changeCount(-1)">-</button>
            <button onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        const TOPIC = "mure_pos_live_counter_channel_2026";
        const SERVER_URL = `https://ntfy.sh/${TOPIC}`;
        
        let currentCount = 0;
        const countView = document.getElementById('count-view');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        if (window.location.search.includes('view')) {
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        // 실시간 신호 감지 (0.1초 초고속 연동)
        const eventSource = new EventSource(`${SERVER_URL}/sse`);
        
        eventSource.onmessage = (event) => {
            try {
                const eventData = JSON.parse(event.data);
                if (eventData && eventData.message !== undefined && !isNaN(eventData.message)) {
                    currentCount = Number(eventData.message);
                    countView.innerText = currentCount;
                }
            } catch (e) {
                console.log("신호 대기 중...");
            }
        };

        // 🌟 중간에 접속하거나 새로고침한 기기도 마지막 숫자를 무조건 찾아내는 완전 보완 함수
        function loadLastSignalFromServer() {
            // 캐시를 타지 않도록 주소 뒤에 매번 다른 난수를 붙여서 강제로 최신 데이터를 요청
            fetch(`${SERVER_URL}/json?since=all&nocache=` + new Date().getTime())
                .then(res => res.text())
                .then(text => {
                    if (!text.trim()) return;
                    
                    // 서버에 쌓인 로그들을 한 줄씩 쪼개서 배열로 만듦
                    const lines = text.trim().split("\n");
                    
                    // 가장 최근(맨 뒤)에 쌓인 로그부터 거꾸로 뒤지면서 진짜 '숫자'만 찾아냄
                    for (let i = lines.length - 1; i >= 0; i--) {
                        if (!lines[i]) continue;
                        try {
                            const data = JSON.parse(lines[i]);
                            if (data && data.message !== undefined && !isNaN(data.message) && data.message.trim() !== "") {
                                currentCount = Number(data.message);
                                countView.innerText = currentCount;
                                break; // 마지막 최신 숫자 하나 찾으면 바로 작동 멈춤
                            }
                        } catch(e) { }
                    }
                })
                .catch(err => console.log("초기 로딩 대기..."));
        }

        function changeCount(amount) {
            const nextCount = currentCount + amount;
            sendSignal(nextCount);
        }

        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                sendSignal(0);
            }
        }

        function sendSignal(value) {
            fetch(SERVER_URL, {
                method: 'POST',
                body: String(value)
            });
        }

        // 화면이 켜지자마자 실행하고, 3초 뒤에 혹시 모를 로딩 유실을 방지하기 위해 한 번 더 체크
        loadLastSignalFromServer();
        setTimeout(loadLastSignalFromServer, 1000);
        setTimeout(loadLastSignalFromServer, 300);
    </script>
</body>
</html>
