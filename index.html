<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 공유 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container { text-align: center; }
        .number {
            font-size: 16rem;
            font-weight: 800;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        .btn-group { display: flex; gap: 25px; justify-content: center; }
        button {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 25px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        button:active { background-color: #444444; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        <div class="btn-group" id="controls">
            <button onclick="changeCount(-1)">-</button>
            <button onclick="changeCount(1)">+</button>
        </div>
    </div>

    <script>
        // 무조건 데이터가 새로고침되도록 주소 뒤에 난수를 붙이는 무정지 시스템
        const API_URL = "https://api.counterapi.dev/v1/mure_live_counter/counter";
        
        let currentCount = 0;
        const countView = document.getElementById('count-view');
        const controls = document.getElementById('controls');

        if (window.location.search.includes('view')) {
            controls.classList.add('hidden');
        }

        // 브라우저 캐시를 무시하고 무조건 서버에서 강제로 긁어오는 함수
        function updateCountFromServer() {
            // 주소창 뒤에 실시간 시간을 붙여 사파리가 과거 데이터를 재탕하지 못하게 막음 (캐시 파괴)
            fetch(API_URL + "?nocache=" + new Date().getTime(), {
                method: "GET",
                headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.count !== undefined) {
                    currentCount = data.count;
                    countView.innerText = currentCount;
                }
            })
            .catch(err => console.log("재연결 중..."));
        }

        function changeCount(amount) {
            currentCount += amount;
            countView.innerText = currentCount;

            const action = amount === 1 ? '/up' : '/down';
            fetch(API_URL + action)
                .then(res => res.json())
                .then(data => {
                    if(data && data.count !== undefined) {
                        currentCount = data.count;
                        countView.innerText = currentCount;
                    }
                });
        }

        // 처음 켤 때 실행
        updateCountFromServer();

        // 🌟 동기화 속도를 0.5초(500ms)로 대폭 단축하여 실시간 감시 작동
        setInterval(updateCountFromServer, 500);
    </script>
</body>
</html>
