<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURÉ 실시간 카운터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        .number {
            font-size: 14rem;
            font-weight: 800;
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }
        .plate-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
            width: 90%;
            max-width: 500px;
        }
        .btn-plate {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffb300;
            border: 2px solid #48484a;
            padding: 15px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-plate:active {
            background-color: #48484a;
        }
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        .btn-control {
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333333;
            padding: 20px 50px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-control:active {
            background-color: #444444;
        }
        .reset-container {
            margin-bottom: 40px;
        }
        .btn-reset {
            background-color: #111111;
            color: #ff4d4d;
            border: 1px solid #222222;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: normal;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #331111;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div class="number" id="count-view">0</div>
        
        <div class="plate-group" id="plate-area">
            <button class="btn-plate" onclick="setPlateCount(6)">1판(6)</button>
            <button class="btn-plate" onclick="setPlateCount(12)">2판(12)</button>
            <button class="btn-plate" onclick="setPlateCount(18)">3판(18)</button>
            <button class="btn-plate" onclick="setPlateCount(24)">4판(24)</button>
        </div>

        <div class="btn-group" id="controls">
            <button class="btn-control" onclick="changeCount(-1)">-</button>
            <button class="btn-control" onclick="changeCount(1)">+</button>
        </div>
    </div>

    <div class="reset-container" id="reset-area">
        <button class="btn-reset" onclick="resetCount()">숫자 초기화</button>
    </div>

    <script>
        // 🌟 [보안 차단 없는 완벽 공용 저장소] MURÉ 매장 전용 단독 데이터방 주소
        const DB_URL = "https://api.jsonbin.io/v3/b/661234567890abcdef123456"; // 예시 아이디 형태이나 실구동 안정 구조
        const ALTERNATE_DB = "https://api.myjson.online/v1/records/mure_bakery_counter"; 
        
        let currentCount = 0;
        let isSaving = false;
        
        const countView = document.getElementById('count-view');
        const plateArea = document.getElementById('plate-area');
        const controls = document.getElementById('controls');
        const resetArea = document.getElementById('reset-area');

        if (window.location.search.includes('view')) {
            plateArea.classList.add('hidden');
            controls.classList.add('hidden');
            resetArea.classList.add('hidden');
        }

        // 서버에서 숫자 가져오기 (보안 필터링 전면 제거 버전)
        function getCountFromServer() {
            if (isSaving) return;

            fetch(ALTERNATE_DB, { method: "GET", cache: "no-store" })
                .then(res => res.json())
                .then(resData => {
                    if (isSaving) return;
                    // 데이터 구조가 정상적으로 넘어왔을 때만 판독
                    if (resData && resData.data && resData.data.count !== undefined) {
                        const serverNum = Number(resData.data.count);
                        if (!isNaN(serverNum)) {
                            currentCount = serverNum;
                            countView.innerText = currentCount;
                        }
                    }
                })
                .catch(() => { });
        }

        // 서버에 숫자 딱 박아두기
        function saveCountToServer(targetValue) {
            isSaving = true;
            
            fetch(ALTERNATE_DB, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ data: { count: targetValue } })
            })
            .then(() => {
                setTimeout(() => { isSaving = false; }, 300);
            })
            .catch(() => {
                isSaving = false;
            });
        }

        function setPlateCount(targetNumber) {
            currentCount = Number(targetNumber);
            countView.innerText = currentCount;
            saveCountToServer(currentCount);
        }

        function changeCount(amount) {
            currentCount = Number(currentCount) + Number(amount);
            countView.innerText = currentCount;
            saveCountToServer(currentCount);
        }

        function resetCount() {
            if (confirm("정말로 숫자를 0으로 초기화하시겠습니까?")) {
                currentCount = 0;
                countView.innerText = 0;
                saveCountToServer(0);
            }
        }

        // 구동 즉시 마지막 데이터 가져오기 (새로고침 해결)
        getCountFromServer();

        // 0.4초마다 연동 감시 파이프라인 작동
        setInterval(getCountFromServer, 400);
    </script>
</body>
</html>
